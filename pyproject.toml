[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chemocalib"
version = "1.0.0"
description = "Chemometrics-Calibrated Constraint-Based Metabolic Modeling via Multi-Block PLS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Xin Zhang", email = "xinzhang@cnu.edu.cn"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "cobra>=0.26",
    "openpyxl",
    "xlrd",
    "tabulate",
]
keywords = [
    "metabolic-modeling",
    "flux-balance-analysis",
    "multi-block-pls",
    "chemometrics",
    "genome-scale-model",
    "multi-omics",
    "systems-biology",
    "transcriptomics",
    "metabolomics",
    "13C-MFA",
    "constraint-based-modeling",
    "GEM",
]

[project.urls]
Homepage = "https://github.com/chemocalib/chemocalib"
Documentation = "https://github.com/chemocalib/chemocalib/tree/main/docs"
Repository = "https://github.com/chemocalib/chemocalib"
Issues = "https://github.com/chemocalib/chemocalib/issues"

[project.scripts]
chemocalib = "chemocalib.cli:main"

[tool.setuptools.packages.find]
include = ["chemocalib", "chemocalib.*"]

[tool.setuptools.package-data]
chemocalib = ["../data/*.csv", "../models/*.xml", "../models/*.json"]
